fail_fast: false

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: &verbatim (^|/)testdata/|providers\.json$
  - id: end-of-file-fixer
    exclude: *verbatim
  - id: check-toml
  - id: check-yaml
  - id: check-added-large-files

- repo: https://github.com/golangci/golangci-lint
  rev: v2.14.0
  hooks:
  - id: golangci-lint-config-verify
  - id: golangci-lint-full

- repo: https://github.com/crate-ci/typos
  rev: v1.44.0
  hooks:
  - id: typos
    # Sites' own words in other languages are data, not English to spell-check.
    exclude: (^go\.(mod|sum)$|(^|/)testdata/|providers\.json$|_boilerplate\.go$)

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
