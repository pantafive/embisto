<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>A post, by oEmbed</title>
<style>
a.e-card:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
@media (prefers-color-scheme: dark) {
  body.e-body { background: #0d1117 !important; }
  a.e-card { background: #161b22 !important; border-color: #30363d !important; color: #e6edf3 !important; }
  .e-site, .e-note { color: #9da7b3 !important; }
  .e-description { color: #c9d1d9 !important; }
  img.e-picture { background: #21262d !important; }
}
</style>
</head>
<body class="e-body" style="margin: 0; padding: 8px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<a class="e-card" href="https://example.com/post" target="_blank" rel="noopener noreferrer" style="display: block; max-width: 600px; border: 1px solid #d0d7de; border-radius: 12px; overflow: hidden; text-decoration: none; color: #1f2328; background: #ffffff;">
<div style="padding: 12px 16px 14px;">
<div class="e-site" style="font-size: 13px; line-height: 16px; color: #59636e;"><img src="https://example.com/favicon.ico" alt="" width="16" height="16" referrerpolicy="no-referrer" style="width: 16px; height: 16px; border-radius: 3px; vertical-align: -3px; margin-right: 6px;">Example</div>
<div style="margin-top: 4px; font-size: 17px; line-height: 1.3; font-weight: 600;">A post, by oEmbed</div>
</div>
</a>
</body>
</html>
