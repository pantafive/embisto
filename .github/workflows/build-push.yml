name: Build and push image

# A push to main whose CI passed builds the image. Two tags land on ghcr:
#   :main       — moving tag
#   :sha-XXXX   — immutable anchor for rollbacks

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes the image of an older one; its tests have finished in CI either way.
concurrency:
  group: build-embisto
  cancel-in-progress: true

jobs:
  build:
    # CI of a pull request from a fork's branch named main also completes on main; only a push to main builds.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        # git describe needs the tags.
        fetch-depth: 0

    - name: Compute sha tag and version
      id: tag
      run: |
        echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: VERSION=${{ steps.tag.outputs.version }}
        tags: |
          ghcr.io/pantafive/embisto:main
          ghcr.io/pantafive/embisto:sha-${{ steps.tag.outputs.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/pantafive/embisto
          org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}
          org.opencontainers.image.licenses=MIT
        # A separate cache tag with mode=max keeps the Go build stage too; an inline cache holds only the final one.
        cache-from: type=registry,ref=ghcr.io/pantafive/embisto:buildcache
        cache-to: type=registry,ref=ghcr.io/pantafive/embisto:buildcache,mode=max
