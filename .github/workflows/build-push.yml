name: Build and push image

# Push to main triggers a build. Two tags land on ghcr:
#   :main       — moving tag
#   :sha-XXXX   — immutable anchor for rollbacks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-embisto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - run: go vet ./...
    - run: go test ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compute sha tag
      id: tag
      run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/pantafive/embisto:main
          ghcr.io/pantafive/embisto:sha-${{ steps.tag.outputs.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/pantafive/embisto
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=MIT
        # A separate cache tag with mode=max keeps the Go build stage too; an inline cache holds only the final one.
        cache-from: type=registry,ref=ghcr.io/pantafive/embisto:buildcache
        cache-to: type=registry,ref=ghcr.io/pantafive/embisto:buildcache,mode=max
