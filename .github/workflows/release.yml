name: Release

# A tag v* publishes the release: static binaries for linux, darwin and windows on amd64 and arm64, and a multi-arch
# image tagged with the version, and for a release that is not a pre-release with major.minor and latest. The notes
# are the version's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

# Only the jobs that publish get a token that writes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check that the tag is a version
      run: |
        semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
        if ! [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
          echo "::error::$GITHUB_REF_NAME is not v followed by a semantic version"
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test -race ./...

  binaries:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Take the release notes from CHANGELOG.md
      run: |
        version=${GITHUB_REF_NAME#v}
        awk -v heading="## [$version]" '
          /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
          /^\[[^]]+\]: / { next }
          found
        ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
        if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
          echo "::error::CHANGELOG.md has no section for $version"
          exit 1
        fi
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: v2.18.3
        args: release --clean --release-notes ${{ runner.temp }}/notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/pantafive/embisto
        # latest=auto adds latest, and the major.minor pattern its tag, only for a version that is not a pre-release.
        flavor: latest=auto
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: VERSION=${{ steps.meta.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
