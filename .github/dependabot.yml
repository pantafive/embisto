# Weekly, one pull request per ecosystem. The actions are pinned by commit; Dependabot moves the pin and its comment.
version: 2

updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  groups:
    go:
      patterns: ["*"]

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns: ["*"]

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  groups:
    images:
      patterns: ["*"]
