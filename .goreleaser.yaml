# Static binaries for every platform, on a tag v*. The image is built by the release workflow from the Dockerfile.
version: 2

project_name: embisto

before:
  hooks:
    - go run ./scripts/notices -o THIRD_PARTY_NOTICES

builds:
  - id: embisto
    main: ./cmd/embisto
    binary: embisto
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/pantafive/embisto.release={{.Version}}

archives:
  - id: embisto
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, THIRD_PARTY_NOTICES, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

# No changelog section: the release workflow passes the version's section of CHANGELOG.md with --release-notes, which
# goreleaser reads only while its changelog is enabled.

release:
  github:
    owner: pantafive
    name: embisto
  prerelease: auto
  footer: "See [CHANGELOG.md](https://github.com/pantafive/embisto/blob/{{ .Tag }}/CHANGELOG.md) for every version."
